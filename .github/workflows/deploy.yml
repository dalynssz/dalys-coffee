# =====================================================
# PUBLICAR EL FRONTEND EN GITHUB PAGES
# Cada vez que haces "git push" a main, GitHub:
#   1. instala las dependencias de /frontend
#   2. compila la página (npm run build)
#   3. la publica en https://dalynssz.github.io/dalys-coffee/
# La dirección del backend (Render) viene de la variable VITE_API_URL
# (Settings > Secrets and variables > Actions > Variables).
# =====================================================
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la página
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
